    <script>
      // Gracefully handle Vite HMR WebSocket connection closures in iframe dev environment
      (function() {
        // Intercept Vite HMR WebSocket connections to avoid failed connection spam
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = (protocols === 'vite-hmr') ||
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf(':24678') !== -1;
            if (isViteHmr) {
              // Return a silent mock WebSocket for Vite HMR
              return {
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                url: urlStr,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(item) {
            if (item instanceof Error) return (item.stack || item.message);
            return typeof item === 'object' ? JSON.stringify(item) : String(item);
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('vite') !== -1 && msg.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || '');
          var src = String(source || '');
          var errStr = error ? String(error.message || error.stack || '') : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            src.indexOf('@vite/client') !== -1 ||
            errStr.indexOf('WebSocket') !== -1
          ) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var filename = (e && e.filename) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            filename.indexOf('@vite/client') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
